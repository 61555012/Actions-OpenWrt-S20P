#
# 基于 P3TERX/Actions-OpenWrt 模板改造
# 目标源码: chasey-dev/immortalwrt-mt798x-rebase (25.12)
# 机型:     CLX S20P (mediatek/filogic, clx_s20p)
# 配置:     configs/25.12/s20p-chasey-25.12.config
# DIY:      diy/25.12/diy-part{1,2}.sh
# 特性:
#   - OpenAppFilter (删除源码自带, 重拉 destan19 最新版)
#   - argon 主题 + 主题设置: 拉取 jerrykuku v3.1.1 (默认居中登录页 + Bing 壁纸)
#   - 修复 2.5G 口 LED (dts-ext/mt7986a-clx-s20p.dts: 0x001b -> 0x321b)
#   - 工具链缓存复用: actions/cache + Release(toolchain-cache) 双级缓存
#   - 固件上传到本仓库 Releases
#   - 根目录 files/ 自动合并进固件
#

name: S20P-25.12-Chasey

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试'
        required: false
        default: 'false'
  schedule:
    # 每天北京时间早上 6 点(UTC 22:00)
    - cron: '0 22 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: configs/25.12/s20p-chasey-25.12.config
  DIY_P1_SH: diy/25.12/diy-part1.sh
  DIY_P2_SH: diy/25.12/diy-part2.sh
  UPLOAD_RELEASE: true
  DEVICE_NAME: s20p-chaseydev
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds / DIY part 1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # 自定义插件必须在此处(update 之后 / install 之前)执行
    - name: Custom packages / DIY part 2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 引用 files 文件夹进固件 (合并式拷贝, 不覆盖源码已有目录)
        mkdir -p openwrt/files
        if [ -d files ]; then cp -a files/. openwrt/files/ && echo "files/ 已合并进 openwrt/files"; fi
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
        # 关闭 Ruby YJIT, 避免潜在 Rust 长编译
        sed -i '/CONFIG_RUBY_ENABLE_YJIT/d' .config
        echo "# CONFIG_RUBY_ENABLE_YJIT is not set" >> .config
        make defconfig
        # ---- ccache: 编译器对象缓存, 跨构建复用已编译的 .o ----
        if ! grep -q '^CONFIG_CCACHE=y' .config; then
          if grep -qE '^[[:space:]]*config[[:space:]]+CCACHE$' Config-build.in 2>/dev/null; then
            echo 'CONFIG_CCACHE=y' >> .config
            make defconfig
          fi
        fi
        if grep -q '^CONFIG_CCACHE=y' .config; then
          echo "✅ CONFIG_CCACHE 已启用（host ccache 在工具链阶段校验）"
        else
          echo "::warning::CONFIG_CCACHE 未生效，本次不使用 ccache（不影响构建）"
        fi

    # 强制校验: 目标必须是 mediatek/filogic + clx_s20p, 否则立即失败
    # (历史上曾因缺 TARGET_BOARD/TARGET_SUBTARGET 而回落成 openwrt_one)
    - name: Verify target device
      run: |
        cd openwrt
        echo "===== .config 目标相关行 ====="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES|mediatek_filogic_DEVICE)' .config || true
        DEV=$(grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_[a-z0-9_]+=y$' .config | sed -r 's/^CONFIG_TARGET_mediatek_filogic_DEVICE_(.*)=y/\1/' | head -1)
        BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        echo "board=$BOARD subtarget=$SUB device=$DEV"
        if [ "$BOARD" != "mediatek" ] || [ "$SUB" != "filogic" ] || [ "$DEV" != "clx_s20p" ]; then
          echo "❌ 目标机型不符: 期望 mediatek/filogic/clx_s20p, 实际 $BOARD/$SUB/$DEV"
          exit 1
        fi
        echo "✅ 目标机型校验通过: mediatek/filogic/clx_s20p"

    # 校验: overview 的 CPU 占用改成实时采样（files/ 覆盖 rpcd ucode + overview 视图）
    # 与 Actions-OpenWrt-ponwrt 同一套实现，两边 UI 一致（只显示纯百分比）
    - name: Verify realtime CPU usage overlay
      run: |
        ok=1
        for f in usr/share/rpcd/ucode/luci \
                 www/luci-static/resources/view/status/include/10_system.js; do
          if [ -f "files/$f" ]; then echo "✅ files/$f"; else echo "❌ 缺少 files/$f"; ok=0; fi
        done
        if grep -q 'function selfTicks' files/usr/share/rpcd/ucode/luci 2>/dev/null &&
           grep -q "sprintf('%d%%'" files/usr/share/rpcd/ucode/luci 2>/dev/null; then
          echo "✅ getCPUUsage 为实时采样（已扣除采样器自身占用）"
        else
          echo "❌ files/usr/share/rpcd/ucode/luci 不是实时 CPU 采样版本"; ok=0
        fi
        if grep -q 'PPE:' files/usr/share/rpcd/ucode/luci 2>/dev/null ||
           grep -q "sprintf('CPU" files/usr/share/rpcd/ucode/luci 2>/dev/null; then
          echo "❌ CPU 行带了额外前缀（应只显示 0% 这样的纯百分比）"; ok=0
        else
          echo "✅ CPU 行只显示纯百分比（无 CPU: / PPE 前缀）"
        fi
        if grep -q 'poll.add' files/www/luci-static/resources/view/status/include/10_system.js 2>/dev/null &&
           grep -q 'document.hidden' files/www/luci-static/resources/view/status/include/10_system.js 2>/dev/null; then
          echo "✅ overview 的 CPU 行 3 秒轮询 + 页面不可见时停采"
        else
          echo "❌ 10_system.js 缺少轮询或可见性判断"; ok=0
        fi
        [ "$ok" = "1" ] || exit 1

    # 校验: mosdns 已移除（连带 Go 工具链替换与 v2ray-geodata），不能被带回来
    - name: Verify mosdns removed
      run: |
        cd openwrt
        ok=1
        absent() {
          if grep -qE "^$1=[ym]" .config; then echo "❌ $1 仍被选中"; ok=0;
          else echo "✅ $1 未选中"; fi
        }
        absent CONFIG_PACKAGE_mosdns
        absent CONFIG_PACKAGE_luci-app-mosdns
        absent CONFIG_PACKAGE_v2ray-geodata
        if [ -d package/mosdns ] || [ -d package/v2ray-geodata ]; then
          echo "❌ package/ 下仍有 mosdns / v2ray-geodata 源码"; ok=0
        else
          echo "✅ package/ 下无 mosdns / v2ray-geodata 源码"
        fi
        [ "$ok" = "1" ] || exit 1

    # 强校验: 防火墙必须默认全开 (fw4 / nftables)
    - name: Verify firewall enabled
      run: |
        cd openwrt
        ok=1
        check() {
          if grep -q "^$1=y\|^$1=m" .config; then echo "✅ $1";
          else echo "❌ $1 未选中 -> 防火墙未默认开启"; ok=0; fi
        }
        check CONFIG_PACKAGE_firewall4
        # nftables 是多变体包(nftables-json / nftables-nojson, PROVIDES=nftables),
        # 不存在 CONFIG_PACKAGE_nftables 这个符号; firewall4 依赖 +nftables-json,
        # 这里必须校验真实符号, 确认 nftables 二进制确实被编译进固件
        if grep -qE '^CONFIG_PACKAGE_nftables(-json|-nojson)=[ym]$' .config; then
          echo "✅ nftables -> $(grep -oE '^CONFIG_PACKAGE_nftables(-json|-nojson)=[ym]' .config | head -1)"
        else echo "❌ nftables(nftables-json/nojson) 未选中 -> 防火墙不会编译进固件"; ok=0; fi
        check CONFIG_PACKAGE_luci-app-firewall
        if grep -q '^CONFIG_PACKAGE_firewall=y' .config; then
          echo "❌ 检测到旧版 fw3 (firewall) 被启用, 与 fw4 冲突"; ok=0
        else
          echo "✅ 未使用旧版 fw3"
        fi
        if [ "$ok" != "1" ]; then
          echo "❌ 防火墙校验失败, 终止编译"
          exit 1
        fi
        echo "✅ 防火墙 (fw4/nftables) 默认开启校验通过"

    # 强校验: OAF 识别内核必须编译进固件（用户列表插件的 APP 识别数据源）。
    # 包名 ≠ destan19 目录名: oaf/ 目录定义的是 KernelPackage/oaf（真名
    # kmod-oaf），open-app-filter/ 目录定义的是 Package/appfilter（真名
    # appfilter）。名字写错时 make defconfig 会静默丢包——固件照常出包，
    # 但 oafd 没了，用户列表/访问记录/APP 统计全部空白，必须在这里拦住。
    - name: Verify OAF recognition kernel
      run: |
        cd openwrt
        ok=1
        check() {
          if grep -q "^$1=y" .config; then echo "✅ $1";
          else echo "❌ $1 未选中 -> OAF 识别内核缺失"; ok=0; fi
        }
        check CONFIG_PACKAGE_appfilter
        check CONFIG_PACKAGE_kmod-oaf
        if grep -q '^CONFIG_PACKAGE_luci-app-oaf=y' .config; then
          echo "❌ luci-app-oaf 界面不应启用（已由自研用户列表插件替代）"; ok=0
        else
          echo "✅ luci-app-oaf 已排除"
        fi
        if [ "$ok" != "1" ]; then
          echo "❌ OAF 识别内核校验失败, 终止编译"
          exit 1
        fi
        echo "✅ OAF 识别内核 (appfilter + kmod-oaf) 校验通过"

    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        echo "CACHE_KEY=toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}" >> $GITHUB_OUTPUT
        echo "CACHE_PREFIX=toolchain-${TARGET}-${SUBTARGET}" >> $GITHUB_OUTPUT
        echo "缓存键: toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
        # ---- 二次利用: dl 源码包 + ccache 的缓存键 ----
        # dl 按月轮转 / ccache 按 ISO 周轮转: 同周期内精确命中即不重复保存,
        # 避免每次构建都写一条新缓存把 10GB 配额挤爆、反过来淘汰工具链缓存。
        echo "CACHE_TAG=25.12-mtk-filogic" >> $GITHUB_OUTPUT
        echo "DL_KEY=dl2-25.12-mtk-filogic-$(date -u +%Y%m)" >> $GITHUB_OUTPUT
        echo "CC_KEY=ccache-25.12-mtk-filogic-$(date -u +%G-W%V)" >> $GITHUB_OUTPUT
        echo "dl 键: dl2-25.12-mtk-filogic-$(date -u +%Y%m)  ccache 键: ccache-25.12-mtk-filogic-$(date -u +%G-W%V)"

    - name: Restore toolchain (actions/cache)
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Restore toolchain (Release backup)
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET="${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "toolchain-cache 不存在, 首次运行"
          exit 0
        fi
        if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
          gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D .
          if [ -e "$ASSET" ]; then
            tar -I unzstd -xf "$ASSET" || tar -xf "$ASSET"
            rm -f "$ASSET"
            echo "restored=true" >> $GITHUB_OUTPUT
            echo "Release 工具链恢复成功"
          else
            echo "restored=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "restored=false" >> $GITHUB_OUTPUT
          echo "Release 中无该缓存: $ASSET"
        fi

    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt
        if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
          echo "actions/cache 命中, 跳过工具链编译"
          echo "save_cache=false" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        elif [ "${{ steps.release-restore.outputs.restored }}" = "true" ]; then
          echo "Release 缓存命中, 回写 actions/cache"
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=false" >> $GITHUB_OUTPUT
        else
          echo "无缓存, 开始编译工具链..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "save_cache=true" >> $GITHUB_OUTPUT
          echo "save_release=true" >> $GITHUB_OUTPUT
        fi
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "Makefile 已修改: 后续跳过工具链重编译"
        # ---- ccache: 确保 host ccache 可用, 否则回退关闭, 避免编译期 command not found ----
        if grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null; then
          if [ ! -x staging_dir/host/bin/ccache ]; then
            echo "工具链缓存不含 host ccache, 补编..."
            make tools/ccache/install -j$(nproc) >/dev/null 2>&1 || true
          fi
          if [ -x staging_dir/host/bin/ccache ]; then
            mkdir -p .ccache
            staging_dir/host/bin/ccache --max-size=1G || true
            staging_dir/host/bin/ccache --version | head -1
          else
            echo "::warning::host ccache 不可用, 回退关闭 CONFIG_CCACHE"
            sed -i '/^CONFIG_CCACHE/d' .config
            echo '# CONFIG_CCACHE is not set' >> .config
            make defconfig
          fi
        fi

    - name: Save toolchain (actions/cache)
      uses: actions/cache/save@v4
      if: steps.toolchain.outputs.save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    - name: Save toolchain (Release backup)
      if: steps.toolchain.outputs.save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"
        tar -I zstdmt -cf "${KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${KEY}.tzst"
        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" --title "Toolchain Cache" --notes "自动生成的工具链缓存, 请勿删除" --latest=false
        fi
        gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}" | while read -r old; do
          echo "删除旧缓存: $old"
          gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
        done
        gh release upload toolchain-cache "${KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
        rm -f "${KEY}.tzst"

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    - name: Restore dl cache (源码包)
      uses: actions/cache@v4
      id: dl-cache
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.cache-key.outputs.DL_KEY }}
        restore-keys: |
          dl2-25.12-mtk-filogic-

    - name: Restore ccache (编译对象缓存)
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ steps.cache-key.outputs.CC_KEY }}
        restore-keys: |
          ccache-25.12-mtk-filogic-

    - name: Report cache state
      run: |
        cd openwrt
        echo "dl 命中: ${{ steps.dl-cache.outputs.cache-hit }} / ccache 命中: ${{ steps.ccache-cache.outputs.cache-hit }}"
        du -sh dl 2>/dev/null || echo "dl 尚不存在"
        du -sh .ccache 2>/dev/null || echo ".ccache 尚不存在"
        df -hT / | tail -1

    - name: Download package
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        # 只清 dl 顶层的失败下载残留(HTML 错误页之类)。
        # 必须加 -maxdepth 1: 递归清理会误删 dl 下 .go/.mod 一类的合法小文件。
        find dl -maxdepth 1 -size -1024c -exec ls -l {} \;
        find dl -maxdepth 1 -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        # 设备选择丢失时不出镜像, 必须直接失败, 否则会发一个只有 bl2 的假 release
        if [ ! -s DEVICE_NAME ]; then
          echo "::error::.config 中已无 CONFIG_TARGET_*_DEVICE_*=y, 目标镜像不会生成"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES|.*DEVICE_)' .config || true
          exit 1
        fi
        echo "DEVICE_SUFFIX=_$(head -1 DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: success() && env.UPLOAD_RELEASE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 发布前硬校验: 目录里必须有 >5MB 的镜像, 否则只有 bootloader 的 bl2 文件
        BIG=$(find . -maxdepth 1 -type f -size +5M | head -1)
        if [ -z "$BIG" ]; then
          echo "::error::固件目录里没有大于 5MB 的镜像, 拒绝发布"
          ls -lh
          exit 1
        fi
        echo "镜像: $BIG"
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: success() && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=${DEVICE_NAME}${DEVICE_SUFFIX}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT
        {
          echo "## S20P 固件 (chasey-dev 25.12)"
          echo ""
          echo "| 项目 | 详情 |"
          echo "|------|------|"
          echo "| 源码 | $REPO_URL |"
          echo "| 分支 | $REPO_BRANCH |"
          echo "| 设备 | clx_s20p / filogic |"
          echo "| 插件 | OpenAppFilter（用户列表 / APP 识别） |"
          echo "| LED  | 2.5G 口已修复 |"
          echo "| 时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
        } > release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: success() && steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
        delete_tag_pattern: '^s20p-chaseydev-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
